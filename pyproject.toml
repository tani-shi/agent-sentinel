[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-sentinel"
version = "2026.11.08"
description = "Claude Code and Codex hook for evaluating tool permission requests"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-sentinel = "agent_sentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.0.2",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
