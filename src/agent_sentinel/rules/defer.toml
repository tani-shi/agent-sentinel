# --- GitHub Mutations ---

[[rules]]
name = "gh-mutate"
command_regex = '''^\s*gh\s+(pr|issue)\s+(create|close|merge|reopen|edit|comment|review)(\s|$)'''

[[rules]]
name = "gh-release"
command_regex = '''^\s*gh\s+release\s+(create|delete|edit|upload)(\s|$)'''

[[rules]]
name = "gh-repo-mutate"
command_regex = '''^\s*gh\s+repo\s+(create|delete|fork|rename|archive|edit)(\s|$)'''

[[rules]]
name = "gh-api-mutate"
command_regex = '''^\s*gh\s+api\s+.*(-X|--method)\s+(POST|PUT|DELETE|PATCH)'''

[[rules]]
name = "gh-workflow-mutate"
command_regex = '''^\s*gh\s+workflow\s+(run|disable|enable|delete)(\s|$)'''

# --- Git Force Push / Remote Deletion ---

[[rules]]
name = "git-push-force"
command_regex = '''^\s*git\s+push(?=\s)(?=.*\s(--force(?!-with-lease)\b|-[a-zA-Z]*f[a-zA-Z]*\b))'''

[[rules]]
name = "git-push-refspec-force"
command_regex = '''^\s*git\s+push\s+.*\s\+\S'''

[[rules]]
name = "git-push-delete"
command_regex = '''^\s*git\s+push(?=\s)((?=.*\s(--delete|-d)\b)|(?=.*\s:\S))'''

# --- Git Commit Policy ---

[[rules]]
name = "git-commit"
command_regex = '''^\s*git\s+(-C\s+\S+\s+)?commit(\s|$)'''

# --- HTTP Mutations ---

# `@loopback_only@` (defined in [fragments], expanded by the rule engine)
# exempts a curl/wget mutation that targets ONLY a literal loopback host. The
# exemption does not allow it: no allow rule covers the mutation, so it still
# defers. Each guard in the fragment blocks a distinct way a request could
# still leave the loopback.

[[rules]]
name = "curl-mutate"
command_regex = '''^\s*(curl|wget)\s+(?!@loopback_only@).*(-X|--request)\s+(POST|PUT|DELETE|PATCH)'''

[[rules]]
name = "curl-data"
command_regex = '''^\s*curl\s+(?!@loopback_only@).*(-d\s|--data\s|--data-raw\s|--data-binary\s|--data-urlencode\s)'''

# --- Google Cloud Mutations ---

[[rules]]
name = "gcloud-mutate"
command_regex = '''^\s*gcloud\s+.*\s+(create|delete|update|set|add|remove|deploy|submit|run|import|export|enable|disable|reset|start|stop|resize|move|restore|cancel|approve|deny|revoke|bind|unbind|attach|detach|push|promote|rollback|abort|suspend|resume)(\s|$)'''

[[rules]]
name = "gcloud-pubsub-pull"
command_regex = '''^\s*gcloud\s+pubsub\s+subscriptions\s+pull(\s|$)'''

# --- AWS Mutations ---

[[rules]]
name = "aws-mutate"
command_regex = '''^\s*aws\s+\S+\s+(create|delete|put|update|modify|set|add|attach|detach|associate|disassociate|run|start|stop|terminate|reboot|register|deregister|enable|disable|authorize|revoke|tag|untag|copy|restore|import|publish|send|invoke|execute|apply|cancel|accept|reject|replace|reset|purchase|request|release|allocate|deploy|upload|move|abort|rotate|resize|upgrade|downgrade|activate|deactivate|promote|retry|provision|initiate|submit|schedule|complete)(-\w+)*(\s|$)'''

