# --- Destructive File / Git / Process Operations ---

[[rules]]
name = "git-reset-hard"
command_regex = '''^\s*git\s+(-C\s+\S+\s+)?reset\s+--hard'''

[[rules]]
name = "git-checkout"
command_regex = '''^\s*git\s+(-C\s+\S+\s+)?checkout(\s|$)'''
reason = "`git checkout` bundles branch switching with destructive file restore. Switch branches with `git switch` (`-c` to create, `--detach` for a detached HEAD), and stage a file from another revision with `git restore --source=<rev> --staged`."

[[rules]]
name = "git-clean"
command_regex = '''^\s*git\s+(-C\s+\S+\s+)?clean\s+'''

[[rules]]
name = "osascript"
command_regex = '''^\s*osascript\s+'''

[[rules]]
name = "kill"
command_regex = '''^\s*kill(\s|$)'''

[[rules]]
name = "launchctl-mutate"
command_regex = '''^\s*launchctl\s+(load|unload|bootstrap|bootout|kickstart|kill|enable|disable|start|stop|remove|submit)(\s|$)'''

[[rules]]
name = "xargs-destructive"
command_regex = '''^\s*xargs\s+(rm|kill|chmod|chown|mv|dd)(\s|$)'''

# --- Indirect Code Execution ---

# eval / source / `.` execute arbitrary code from a variable or file.
# We can't statically inspect what they'll run, so always confirm.
[[rules]]
name = "eval-source"
command_regex = '''^\s*(eval|source|\.)\s'''

# --- Notion CLI (ntn) Mutations ---

[[rules]]
name = "ntn-pages-mutate"
command_regex = '''^\s*ntn\s+pages\s+(create|edit|trash)(\s|$)'''

[[rules]]
name = "ntn-files-create"
command_regex = '''^\s*ntn\s+files\s+create(\s|$)'''

[[rules]]
name = "ntn-session-mutate"
command_regex = '''^\s*ntn\s+(login|logout|update)(\s|$)'''

# Raw `ntn api` calls carrying a write signal: an explicit mutating method, an
# inline body (-d/--data*), or a file upload (--file). Mirrors gh-api-mutate.
[[rules]]
name = "ntn-api-mutate"
command_regex = '''^\s*ntn\s+api\s+(?=.*((-X|--method)\s+(POST|PUT|DELETE|PATCH)|(-d|--data)\S*\s|--file\s))'''
