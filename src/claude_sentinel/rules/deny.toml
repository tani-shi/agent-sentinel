# Denied commands and sensitive paths — confirmation cannot be bypassed.

# @name@ tokens in command_regex and path_regex expand to these fragments, so a
# value shared across rules is defined once and cannot drift between them.
[fragments]
# `.env` suffixes that are committed placeholder templates, not real secrets, so
# writes to them are safe to allow.
env_template_suffixes = "example|sample|template|dist"

# --- Command Deny Rules ---

[[rules]]
name = "rm-rf-root"
command_regex = '''rm\s+(-[a-zA-Z]*r[a-zA-Z]*\s+|--recursive\s+)(/\s*$|/\s+|~\s*$|~\s+|\$HOME\s*$|\$HOME\s+)'''

[[rules]]
name = "sudo"
command_regex = '''^\s*sudo\s+'''

[[rules]]
name = "fork-bomb"
command_regex = ''':\(\)\s*\{'''

# Busy-wait: a loop body that is only a no-op burns a CPU core with no work.
# The splitter emits the loop body as its own segment (e.g. `do :`), so this
# anchors on the `do`-prefixed form; a bare `:`/`true` statement is harmless.
# \A (segment start, not MULTILINE line starts) so `do :` inside a heredoc body
# is not misread as a loop body — matching the loop rules below.
[[rules]]
name = "busy-wait-noop"
command_regex = '''\A\s*do\s+(:|true|continue)(\s|;|$)'''
reason = "Don't poll with a shell loop. To wait for a subagent, await its completion notification (delivered automatically) or launch it with run_in_background:false. To wait for an external process (server ready, CI, a file appearing), start it with run_in_background:true and let it exit, or run a single one-shot check — not an in-shell loop."

# Unbounded repetition. A single ASK approval cannot bound how many times a
# loop body runs, so a side-effecting body (gh comment, git push, curl) runs
# away after one confirmation. These are denied outright. `\A` anchors to the
# segment start (not MULTILINE line starts) so `while`/`until`/`for` appearing
# inside a heredoc or commit/PR body is not misread as a loop. List-form
# `for x in ...` (bounded iteration) stays allowed via shell-constructs.
[[rules]]
name = "while-loop"
command_regex = '''\A\s*while(\s|$)'''
reason = "Don't poll with a shell loop. To wait for a subagent, await its completion notification (delivered automatically) or launch it with run_in_background:false. To wait for an external process (server ready, CI, a file appearing), start it with run_in_background:true and let it exit, or run a single one-shot check — not an in-shell loop."

[[rules]]
name = "until-loop"
command_regex = '''\A\s*until(\s|$)'''
reason = "Don't poll with a shell loop. To wait for a subagent, await its completion notification (delivered automatically) or launch it with run_in_background:false. To wait for an external process (server ready, CI, a file appearing), start it with run_in_background:true and let it exit, or run a single one-shot check — not an in-shell loop."

[[rules]]
name = "for-cstyle"
command_regex = '''\A\s*for\s*\(\('''
reason = "Don't poll with a shell loop. To wait for a subagent, await its completion notification (delivered automatically) or launch it with run_in_background:false. To wait for an external process (server ready, CI, a file appearing), start it with run_in_background:true and let it exit, or run a single one-shot check — not an in-shell loop."

[[rules]]
name = "watch"
command_regex = '''\A\s*watch(\s|$)'''
reason = "Don't poll with a shell loop. To wait for a subagent, await its completion notification (delivered automatically) or launch it with run_in_background:false. To wait for an external process (server ready, CI, a file appearing), start it with run_in_background:true and let it exit, or run a single one-shot check — not an in-shell loop."

[[rules]]
name = "mkfs"
command_regex = '''mkfs(\.\w+)?\s+'''

[[rules]]
name = "dd-zero"
command_regex = '''dd\s+.*if=/dev/(zero|urandom)'''

[[rules]]
name = "pipe-to-shell"
command_regex = '''(curl|wget)\s+.*\|\s*(bash|sh|zsh|dash)'''

[[rules]]
name = "force-push-main"
command_regex = '''git\s+push(?=\s)(?=.*\s(--force(?!-with-lease)\b|-[a-zA-Z]*f[a-zA-Z]*\b)).*\b(main|master)\b'''

[[rules]]
name = "refspec-force-push-main"
command_regex = '''git\s+push\s+.*\s\+\S*\b(main|master)\b'''

# Remote deletion of main/master: both `--delete`/`-d` and the empty-source
# refspec form (`git push origin :main`).
[[rules]]
name = "push-delete-main"
command_regex = '''git\s+push(?=\s)(?=.*\s(--delete|-d)\b).*\b(main|master)\b'''

[[rules]]
name = "refspec-delete-main"
command_regex = '''git\s+push\s+.*\s:(main|master)\b'''

[[rules]]
name = "env-write"
command_regex = '''((?:>|>>)\s*|tee\s+.*)\.env(\s|$|\.(?!(?:@env_template_suffixes@)(?:\s|$)))'''

# Dynamic-linker hijacking: setting LD_PRELOAD / DYLD_INSERT_LIBRARIES (and
# their LIBRARY_PATH siblings) injects attacker code into every dynamically
# linked binary launched in the same shell. The variable-assignment and
# export allow rules would otherwise let `export LD_PRELOAD=/evil.so` slip
# through. Anchored at line/segment start so the rule survives the splitter
# leaving multi-line bodies intact.

[[rules]]
name = "dynamic-linker-hijack"
command_regex = '''^\s*(export\s+)?(LD_PRELOAD|LD_LIBRARY_PATH|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH)\s*='''

[[rules]]
name = "gcloud-secrets-access"
command_regex = '''gcloud\s+secrets\s+versions\s+access(\s|$)'''

[[rules]]
name = "gcloud-print-token"
command_regex = '''gcloud\s+auth\s+print-(access|identity)-token(\s|$)'''

[[rules]]
name = "gcloud-service-account-keys"
command_regex = '''gcloud\s+iam\s+service-accounts\s+keys\s+create(\s|$)'''

# `ntn auth token` prints the Notion auth token to stdout, landing it in the
# conversation context. Same exposure as gcloud-print-token.
[[rules]]
name = "ntn-auth-token"
command_regex = '''ntn\s+auth\s+token(\s|$)'''

# The AWS analogues of gcloud-secrets-access / gcloud-print-token. The allow
# rule `aws-read` waves through anything whose verb starts with `get`, so
# without these the same credentials the `aws-dir` path rule protects would be
# readable through the CLI.
[[rules]]
name = "aws-credential-read"
command_regex = '''aws\s+(secretsmanager\s+get-secret-value|ecr\s+get-login-password|configure\s+get|sts\s+(get-session-token|assume-role\S*)|kms\s+(decrypt|generate-data-key\S*))(\s|$)'''
reason = "Prints AWS credentials to stdout, landing them in the conversation context. Reading ~/.aws/credentials directly is blocked for the same reason. Reference the secret by ARN without materializing its value, or have the user run the command themselves."

[[rules]]
name = "aws-ssm-decrypt"
command_regex = '''aws\s+ssm\s+get-parameters?(-by-path)?(?=\s)(?=.*\s--with-decryption(\s|$))'''
reason = "Decrypts a SecureString parameter to stdout. Read the parameter without --with-decryption to confirm it exists, or have the user run the command themselves."

# --- Process Signals (broadcast / pattern-match) ---

[[rules]]
name = "pkill"
command_regex = '''^\s*pkill(\s|$)'''
reason = "Broadcast/pattern kills terminate unintended processes. Target a specific PID (kill <pid>), or stop a background command you started with the native mechanism (KillShell for a run_in_background shell, TaskStop for a monitor) — not pkill/killall."

[[rules]]
name = "killall"
command_regex = '''^\s*killall(\s|$)'''
reason = "Broadcast/pattern kills terminate unintended processes. Target a specific PID (kill <pid>), or stop a background command you started with the native mechanism (KillShell for a run_in_background shell, TaskStop for a monitor) — not pkill/killall."

[[rules]]
name = "kill-broadcast"
command_regex = '''^\s*kill\s+(\S+\s+)*-1(\s|$)'''
reason = "Broadcast/pattern kills terminate unintended processes. Target a specific PID (kill <pid>), or stop a background command you started with the native mechanism (KillShell for a run_in_background shell, TaskStop for a monitor) — not pkill/killall."

[[rules]]
name = "xargs-pkill-killall"
command_regex = '''^\s*xargs\s+(pkill|killall)(\s|$)'''
reason = "Broadcast/pattern kills terminate unintended processes. Target a specific PID (kill <pid>), or stop a background command you started with the native mechanism (KillShell for a run_in_background shell, TaskStop for a monitor) — not pkill/killall."

# --- Sensitive Path Deny Rules (shared by Read, Write, Edit) ---
#
# path_regex guards the paths the hook sees (outside-cwd reads, `.claude/`
# files, and the `sed -i` backdoor check). The PreToolUse hook is not
# guaranteed to fire on the sub-agent and background paths, so in-project
# files are also protected by permissions.deny entries: path_glob is the
# gitignore-style equivalent of path_regex that the installer expands into
# Read/Write/Edit deny entries.
# Globs cannot express negative lookarounds, so a glob may over-match its
# regex (e.g. `**/*.pem` also denies `*.pub.pem`) — erring toward deny.

# --- Environment / Config Files ---

# The negative lookahead exempts the committed-template suffixes
# (`.env.example`/`.sample`/`.template`/`.dist`), like private-key-files exempts
# `.pub.pem`. The glob is only `**/.env`: globs cannot express the lookahead, and
# keeping the `**/.env.*` catch-all would re-block the very templates it cannot
# exempt. Tradeoff: suffixed secret env files (`.env.production` …) then lose the
# settings.json glob deny on hook-less sub-agent/background paths, relying on
# this path_regex alone.
[[sensitive_path_rules]]
name = "env-files"
path_regex = '''(^|/)\.env(\.(?!(?:@env_template_suffixes@)$).+)?$'''
path_glob = ["**/.env"]

[[sensitive_path_rules]]
name = "envrc"
path_regex = '''(^|/)\.envrc$'''
path_glob = ["**/.envrc"]

[[sensitive_path_rules]]
name = "secrets-files"
path_regex = '''(^|/)secrets\.(yml|yaml|json|toml)$'''
path_glob = ["**/secrets.yml", "**/secrets.yaml", "**/secrets.json", "**/secrets.toml"]

[[sensitive_path_rules]]
name = "terraform-vars"
path_regex = '''(^|/)terraform\.tfvars(\.json)?$'''
path_glob = ["**/terraform.tfvars", "**/terraform.tfvars.json"]

# --- SSH / Crypto Keys ---

[[sensitive_path_rules]]
name = "ssh-dir"
path_regex = '''(^|/)\.ssh/'''
path_glob = ["**/.ssh/**"]

[[sensitive_path_rules]]
name = "gnupg-dir"
path_regex = '''(^|/)\.gnupg/'''
path_glob = ["**/.gnupg/**"]

[[sensitive_path_rules]]
name = "private-key-files"
path_regex = '''(?<!\bpub)\.(pem|key)$'''
path_glob = ["**/*.pem", "**/*.key"]

[[sensitive_path_rules]]
name = "keystore-files"
path_regex = '''\.(p12|pfx|jks|keystore)$'''
path_glob = ["**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore"]

# --- Cloud Provider Credentials ---

[[sensitive_path_rules]]
name = "aws-dir"
path_regex = '''(^|/)\.aws/'''
path_glob = ["**/.aws/**"]

[[sensitive_path_rules]]
name = "gcloud-dir"
path_regex = '''(^|/)\.config/gcloud/'''
path_glob = ["**/.config/gcloud/**"]

[[sensitive_path_rules]]
name = "azure-dir"
path_regex = '''(^|/)\.azure/'''
path_glob = ["**/.azure/**"]

[[sensitive_path_rules]]
name = "credentials-json"
path_regex = '''(^|/)(credentials|client_secret|service[-_]account[^/]*)\.json$'''
path_glob = [
  "**/credentials.json",
  "**/client_secret.json",
  "**/service-account*.json",
  "**/service_account*.json",
]

[[sensitive_path_rules]]
name = "terraform-rc"
path_regex = '''(^|/)\.terraformrc$'''
path_glob = ["**/.terraformrc"]

# --- Container / Orchestration ---

[[sensitive_path_rules]]
name = "docker-config"
path_regex = '''(^|/)\.docker/config\.json$'''
path_glob = ["**/.docker/config.json"]

[[sensitive_path_rules]]
name = "kube-config"
path_regex = '''(^|/)\.kube/config$'''
path_glob = ["**/.kube/config"]

# --- Package Manager / Dev Tool Auth ---

[[sensitive_path_rules]]
name = "netrc"
path_regex = '''(^|/)\.netrc$'''
path_glob = ["**/.netrc"]

[[sensitive_path_rules]]
name = "npmrc"
path_regex = '''(^|/)\.npmrc$'''
path_glob = ["**/.npmrc"]

[[sensitive_path_rules]]
name = "pypirc"
path_regex = '''(^|/)\.pypirc$'''
path_glob = ["**/.pypirc"]

[[sensitive_path_rules]]
name = "gh-hosts"
path_regex = '''(^|/)\.config/gh/hosts\.yml$'''
path_glob = ["**/.config/gh/hosts.yml"]

# Notion CLI file-based auth store, used when NOTION_KEYRING=0.
[[sensitive_path_rules]]
name = "notion-auth"
path_regex = '''(^|/)\.config/notion/auth\.json$'''
path_glob = ["**/.config/notion/auth.json"]

[[sensitive_path_rules]]
name = "maven-settings"
path_regex = '''(^|/)\.m2/settings\.xml$'''
path_glob = ["**/.m2/settings.xml"]

[[sensitive_path_rules]]
name = "gradle-properties"
path_regex = '''(^|/)\.gradle/gradle\.properties$'''
path_glob = ["**/.gradle/gradle.properties"]

[[sensitive_path_rules]]
name = "boto-config"
path_regex = '''(^|/)\.(boto|s3cfg)$'''
path_glob = ["**/.boto", "**/.s3cfg"]

# --- Database ---

[[sensitive_path_rules]]
name = "pgpass"
path_regex = '''(^|/)\.pgpass$'''
path_glob = ["**/.pgpass"]

[[sensitive_path_rules]]
name = "mycnf"
path_regex = '''(^|/)\.my\.cnf$'''
path_glob = ["**/.my.cnf"]

# --- Other ---

[[sensitive_path_rules]]
name = "htpasswd"
path_regex = '''(^|/)\.htpasswd$'''
path_glob = ["**/.htpasswd"]

[[sensitive_path_rules]]
name = "vault-token"
path_regex = '''(^|/)\.vault-token$'''
path_glob = ["**/.vault-token"]
